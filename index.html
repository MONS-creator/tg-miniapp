
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background: var(--tg-theme-bg-color,#1c1c1e); color:#fff;
         font-family: sans-serif; text-align:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; }
  .card { background:#2a2a2c; border-radius:16px; padding:16px; border:2px solid transparent; }
  .card.active { border-color:#5fc46a; }
  .price { color:#5fc46a; font-size:20px; margin:8px 0; }
  button { width:100%; padding:12px; border:0; border-radius:12px;
           background:#3478f6; color:#fff; font-size:16px; }
</style>
</head>
<body>
<h2>💻 Услуги разработки</h2>
<div class="grid" id="grid"></div>

<script>
const tg = Telegram.WebApp;
tg.ready();
tg.expand();

const services = [
  {icon:"🤖", name:"Бот-визитка", price:500},
  {icon:"📨", name:"Бот-предложка", price:600},
  {icon:"📈", name:"Парсер / автопостинг", price:700},
  {icon:"📝", name:"Бот-заявки + админка", price:800},
  {icon:"📱", name:"Mini App", price:1200},
  {icon:"🛒", name:"Бот-магазин", price:1500},
];

let selected = null;

const grid = document.getElementById("grid");
services.forEach(s => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<div style="font-size:48px">${s.icon}</div>
    <div>${s.name}</div><div class="price">от ${s.price} грн</div>
    <button>Выбрать</button>`;
  el.querySelector("button").onclick = () => {
    selected = s;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    tg.MainButton.setText("Заказать: " + s.name);
    tg.MainButton.show();
  };
  grid.appendChild(el);
});

tg.MainButton.onClick(() => {
  tg.sendData(JSON.stringify(selected)); // отправка боту, окно закроется
});
</script>
</body>
</html>
