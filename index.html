<script>
var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
var item = null;

function pick(id, name, price) {
  item = { name: name, price: price };
  ['c1','c2','c3','c4'].forEach(function(x){ document.getElementById(x).style.borderColor = 'transparent'; });
  document.getElementById(id).style.borderColor = '#34c759';
  document.getElementById('order-btn').innerText = '✅ Оформить: ' + name + ' (' + price + ' грн)';
  document.getElementById('bar').style.display = 'block';
}

function pay() {
  if (!item) return;
  var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};
  var chatId = user.id || 2090100256;
  var uname = user.username ? '@' + user.username : chatId;
  var token = '9102265816:AAGG0pEQgUTMdxpJIg81suYKRV7Fk1WWm9I';
  var text = '✅ Заказ из Mini App принят!\n\n📦 Услуга: ' + item.name + '\n💰 Сумма: ' + item.price + ' грн\n👤 Клиент: ' + uname;

  fetch('https://telegram.org' + token + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: chatId, text: text })
  }).finally(function() {
    tg.close();
  });
}
</script>
